<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布新内容 - XHS资讯录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: #ffffff;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .navbar-brand {
            font-weight: bold;
            color: #007bff;
        }
        .container {
            background-color: #ffffff;
            border-radius: 0.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            padding: 2rem;
            margin-top: 2rem;
        }
        h1 {
            color: #007bff;
            margin-bottom: 1.5rem;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        #image-paste-area {
            border: 2px dashed #007bff;
            background-color: #f8f9fa;
            transition: all 0.3s ease;
        }
        #image-paste-area:hover {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">XHS资讯录</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-primary me-2 active" href="{{ url_for('publish') }}">发布新帖子</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-secondary me-2" href="{{ url_for('show_posts') }}">查看所有帖子</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-info me-2" href="{{ url_for('show_notes') }}">查看笔记</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-warning" href="{{ url_for('show_comments', note_url='') }}">查看评论</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div style="height: 70px;"></div>

    <div class="container mt-5">
        <h1 class="text-center">发布新内容</h1>
        <form method="POST" action="{{ url_for('publish') }}" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="title" class="form-label">标题</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">内容</label>
                <textarea class="form-control" id="content" name="content" rows="5" required></textarea>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">价位</label>
                <input type="number" class="form-control" id="price" name="price" step="0.01">
            </div>
            <div class="mb-3">
                <label for="surroundings" class="form-label">周边描述</label>
                <textarea class="form-control" id="surroundings" name="surroundings" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">地址</label>
                <input type="text" class="form-control" id="address" name="address">
            </div>
            <div class="mb-3">
                <label for="purchase_date" class="form-label">购房时间</label>
                <input type="date" class="form-control" id="purchase_date" name="purchase_date">
            </div>
            <div class="mb-3">
                <label for="image-paste-area" class="form-label">图片（粘贴或拖拽到此处）</label>
                <div id="image-paste-area" class="border rounded p-3" style="min-height: 200px; cursor: pointer;">
                    <i class="bi bi-image me-2"></i>点击此处粘贴图片或拖拽图片到此处
                </div>
                <div id="image-preview" class="mt-2"></div>
            </div>
            <input type="hidden" id="image_url" name="image_url" value="">
            <button type="submit" class="btn btn-primary w-100">发布</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const imagePasteArea = document.getElementById('image-paste-area');
        const imagePreview = document.getElementById('image-preview');
        const imageUrlInput = document.getElementById('image_url');

        function handleImage(file) {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.style.maxWidth = '200px';
                    img.style.maxHeight = '200px';
                    imagePreview.innerHTML = '';
                    imagePreview.appendChild(img);
                    imageUrlInput.value = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        // 处理粘贴事件
        document.addEventListener('paste', function(e) {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const file = items[i].getAsFile();
                    handleImage(file);
                    break;
                }
            }
        });

        // 处理拖拽事件
        imagePasteArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.stopPropagation();
        });

        imagePasteArea.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const file = e.dataTransfer.files[0];
            handleImage(file);
        });

        // 处理点击事件（提示用户粘贴）
        imagePasteArea.addEventListener('click', function() {
            alert('请粘贴图片或拖拽图片到此处');
        });
    </script>
</body>
</html>
