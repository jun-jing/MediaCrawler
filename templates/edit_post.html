
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑内容</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">房产信息</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('show_posts') }}">已发布内容</a>
                <a class="nav-link" href="{{ url_for('publish') }}">发布新内容</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h1>编辑内容</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('edit_post', post_id=post['id']) }}" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="title" class="form-label">标题</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ post['title'] }}" required>
            </div>
            <div class="mb-3">
                <label for="content" class="form-label">内容</label>
                <textarea class="form-control" id="content" name="content" rows="5" required>{{ post['content'] }}</textarea>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">价位</label>
                <input type="number" class="form-control" id="price" name="price" step="0.01" value="{{ post['price'] }}">
            </div>
            <div class="mb-3">
                <label for="surroundings" class="form-label">周边描述</label>
                <textarea class="form-control" id="surroundings" name="surroundings" rows="3">{{ post['surroundings'] }}</textarea>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">地址</label>
                <input type="text" class="form-control" id="address" name="address" value="{{ post['address'] }}">
            </div>
            <div class="mb-3">
                <label for="purchase_date" class="form-label">购房时间</label>
                <input type="date" class="form-control" id="purchase_date" name="purchase_date" value="{{ post['purchase_date'] }}">
            </div>
            <div class="mb-3">
                <label for="image" class="form-label">图片</label>
                <input type="file" class="form-control" id="image" name="image" accept="image/*">
                <div id="image-preview" class="mt-2">
                    {% if post['image_url'] %}
                        <img src="{{ post['image_url'] }}" alt="Current image" style="max-width: 200px; max-height: 200px;">
                    {% endif %}
                </div>
            </div>
            <input type="hidden" id="image_url" name="image_url" value="{{ post['image_url'] }}">
            <button type="submit" class="btn btn-primary">更新</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('image').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.style.maxWidth = '200px';
                    img.style.maxHeight = '200px';
                    const previewDiv = document.getElementById('image-preview');
                    previewDiv.innerHTML = '';
                    previewDiv.appendChild(img);
                    document.getElementById('image_url').value = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
