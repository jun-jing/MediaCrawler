<div class="pagination">
    {% for page in pagination.iter_pages() %}
        {% if page %}
            {% if page != pagination.page %}
                <a href="#" data-page="{{ page }}">{{ page }}</a>
            {% else %}
                <span class="current-page">{{ page }}</span>
            {% endif %}
        {% else %}
            <span class="ellipsis">…</span>
        {% endif %}
    {% endfor %}
</div>
